version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: receipt_api_postgres
    environment:
      POSTGRES_USER: receipts_user
      POSTGRES_PASSWORD: receipts_password
      POSTGRES_DB: receipts_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipts_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
